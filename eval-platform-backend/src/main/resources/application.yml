server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: eval-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    problemdetails:
      enabled: true

  # Aucun secret en dur : les valeurs viennent de l'environnement (voir profil dev pour le local)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eval_platform_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    open-in-view: false

# Configuration JWT & Sécurité
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 heures

---
# Profil Dev local avec PostgreSQL (valeurs par défaut uniquement pour le poste de développement)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    password: ${DB_PASSWORD:postgrespassword}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWV2YWwtcGxhdGZvcm0tbm90LWZvci1wcm9kdWN0aW9uIQ==}

---
# Profil Dev avec H2 (activable si PostgreSQL n'est pas encore installé localement)
spring:
  config:
    activate:
      on-profile: h2-dev
  datasource:
    url: jdbc:h2:mem:evaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

jwt:
  secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWV2YWwtcGxhdGZvcm0tbm90LWZvci1wcm9kdWN0aW9uIQ==}
