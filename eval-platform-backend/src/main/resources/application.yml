server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: eval-backend
  profiles:
    active: dev
  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/eval_platform_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Configuration JWT & Sécurité
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000 # 24 heures

---
# Profil Dev avec H2 (activable si PostgreSQL n'est pas encore installé localement)
spring:
  config:
    activate:
      on-profile: h2-dev
  datasource:
    url: jdbc:h2:mem:evaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
