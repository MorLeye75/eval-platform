server:
  port: 8080
  # Derrière un reverse proxy (nginx, traefik…) : FORWARD_HEADERS_STRATEGY=native pour lire l'IP réelle du client
  # dans X-Forwarded-For (Tomcat ne fait confiance qu'aux proxys d'adresses internes). Sans proxy, laisser none :
  # un client pourrait sinon inventer son IP et contourner la limite des tentatives de connexion.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    context-path: /api

spring:
  application:
    name: eval-backend
  # Pas de profil par défaut : un déploiement sans SPRING_PROFILES_ACTIVE ne doit jamais basculer en dev
  # (comptes de démonstration, secret JWT du dépôt). Spring lit directement la variable d'environnement ;
  # en local, `mvn spring-boot:run` active dev (propriété spring-boot.run.profiles du pom).
  mvc:
    problemdetails:
      enabled: true

  # Aucun secret en dur : les valeurs viennent de l'environnement (voir profil dev pour le local)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eval_platform_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Le schéma est géré par Flyway (src/main/resources/db/migration) ; Hibernate se contente de le vérifier
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        # Les collections LAZY (choix, choix cochés...) sont chargées par lots au lieu d'une requête par élément
        default_batch_fetch_size: 50

# Configuration JWT & Sécurité
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 heures

# Origines du front autorisées par CORS, séparées par des virgules (ex. https://eval.ept.sn).
# Pas de « * » : les requêtes portent des identifiants (allowCredentials).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Documentation OpenAPI / Swagger UI : désactivée hors développement (elle décrit toute l'API),
# activable explicitement avec SWAGGER_ENABLED=true
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

---
# Profil Dev local avec PostgreSQL (valeurs par défaut uniquement pour le poste de développement)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    password: ${DB_PASSWORD:postgrespassword}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWV2YWwtcGxhdGZvcm0tbm90LWZvci1wcm9kdWN0aW9uIQ==}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

---
# Profil Dev avec H2 (activable si PostgreSQL n'est pas encore installé localement)
spring:
  config:
    activate:
      on-profile: h2-dev
  datasource:
    url: jdbc:h2:mem:evaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  # Base H2 en mémoire recréée à chaque démarrage : Flyway (SQL PostgreSQL) n'y est pas utilisé
  flyway:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

jwt:
  secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWV2YWwtcGxhdGZvcm0tbm90LWZvci1wcm9kdWN0aW9uIQ==}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
