spring:
  application:
    name: eval-backend-test
  profiles:
    active: test
  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 50

# Les tâches planifiées sont testées en appelant directement le service
passation:
  taches-planifiees:
    actif: false

jwt:
  secret: dGVzdC1vbmx5LXNlY3JldC1ldmFsLXBsYXRmb3JtLWp1bml0LXRlc3RzLW9ubHkh
  expiration-ms: 86400000
