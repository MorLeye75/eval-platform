name: CI - Plateforme d'Évaluation EPT

on:
  push:
    branches:
      - main
      - master
      - 'refactor/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  backend-tests:
    name: Backend Build & Automated Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./eval-platform-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile & Run Automated Tests
        run: mvn clean test --batch-mode

      - name: Publish Test Report (Surefire)
        if: always()
        uses: scacap/action-surefire-report@v1
        with:
          skip_publishing: true
          report_paths: '**/surefire-reports/TEST-*.xml'

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./eval-platform-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: eval-platform-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build
